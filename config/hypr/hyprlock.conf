source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/isarchy/wallpaper
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    outer_color = $accent
    inner_color = $background
    font_color = $foreground
    placeholder_text = <i>Password</i>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
